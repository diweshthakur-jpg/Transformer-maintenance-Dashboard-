<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CPRI & OVERHAULING REPORTS</title><style>
*{box-sizing:border-box}body{margin:0;background:#020711;color:#eef7ff;font-family:Arial,sans-serif}header{padding:20px;background:#061727;border-bottom:1px solid #16435f}h1{margin:0;font-size:23px}.sub{color:#8eb5ca;margin-top:5px}.wrap{max-width:1100px;margin:auto;padding:18px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button{border:0;border-radius:9px;padding:11px 15px;font-weight:bold;background:#087fd1;color:white;cursor:pointer}button:hover{filter:brightness(1.08)}button.red{background:#b72c45}button.green{background:#07965d}button.dark{background:#193141}button:disabled{opacity:.6;cursor:not-allowed}select,input,textarea{width:100%;padding:11px;border-radius:8px;border:1px solid #24536a;background:#03101b;color:white}select{min-width:130px}.card{background:linear-gradient(145deg,#061421,#081d2d);border:1px solid #17435b;border-radius:14px;padding:17px;margin:16px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:600px){.grid{grid-template-columns:1fr}}label{display:block;color:#8fb5c9;font-size:12px;margin-bottom:5px}.upload{margin-top:14px;border:2px dashed #23617d;border-radius:12px;padding:25px;text-align:center;cursor:pointer}.upload input{display:none}.file{color:#70dcff;margin-top:10px;word-break:break-word}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:780px}th,td{padding:11px;border-bottom:1px solid #183a4d;text-align:left;font-size:13px;vertical-align:top}th{color:#6fd5ff;background:#071b29}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{padding:7px 10px;font-size:12px}.badge{background:#07364b;color:#8fe5ff;padding:4px 8px;border-radius:20px;font-size:11px}.status{color:#7ee7b0;font-size:12px}.error{display:none;margin-top:14px;padding:12px;border-radius:9px;background:#35151a;border:1px solid #8d3544;color:#ffb7c1;white-space:pre-wrap}.note{color:#7f9caf;font-size:12px;margin-top:10px}.empty{text-align:center;padding:25px;color:#789}</style></head><body>
<header><h1>📄 CPRI & OVERHAULING REPORTS</h1><div class="sub">CPP Transformer Maintenance System</div></header>
<div class="wrap"><div class="toolbar"><button onclick="addNew()">＋ Add New</button><select id="year" onchange="loadReports()"></select><span id="status" class="status"></span></div>
<div class="card" id="form" style="display:none"><h2>Add / Edit Report</h2><div class="grid"><div><label>Year</label><select id="fy"></select></div><div><label>Report Type</label><select id="type"><option>CPRI</option><option>OVERHAULING</option></select></div></div>
<div class="upload" onclick="document.getElementById('pdf').click()"><input id="pdf" type="file" accept="application/pdf,.pdf" onchange="picked(event)"><b>📄 Upload PDF</b><div>Upload CPRI or OVERHAULING report PDF</div><div id="file" class="file"></div></div>
<div style="margin-top:14px"><label>Remarks</label><textarea id="remarks" rows="4" placeholder="Enter remarks"></textarea></div><div class="note">PDF files are stored in Supabase Storage; report details are stored in <b>cpri_overhauling_reports</b>.</div><div id="error" class="error"></div><div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap"><button class="green" onclick="save()">Save</button><button class="dark" onclick="cancel()">Cancel</button></div></div>
<div class="card"><h2>Saved Reports</h2><div class="table"><table><thead><tr><th>S/N</th><th>Year</th><th>Type</th><th>PDF</th><th>Remarks</th><th>Action</th></tr></thead><tbody id="body"></tbody></table></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL="https://xdzroykambkmpnafeasc.supabase.co";const SUPABASE_KEY="sb_publishable_QYEMJXCzKRkK8Z8WLQw5Sg_7aPS5Sas";const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const TABLE="cpri_overhauling_reports",BUCKET="cpri-overhauling-files";let editId=null,selectedFile=null,oldPdfUrl="";
function years(){let y=new Date().getFullYear(),o="";for(let n=y-5;n<=y+15;n++)o+=`<option value="${n}">${n}</option>`;year.innerHTML=fy.innerHTML=o;year.value=fy.value=y}
function setStatus(m){status.textContent=m||""}function showError(m){error.textContent=m||"";error.style.display=m?"block":"none"}function clearError(){showError("")}function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function fileNameFromUrl(u){if(!u)return"";try{return decodeURIComponent(u.split("?")[0].substring(u.split("?")[0].lastIndexOf("/")+1))}catch(e){return u}}function safeFileName(n){return n.replace(/[^\w.\-]+/g,"_").replace(/^_+|_+$/g,"").slice(0,180)}
function addNew(){editId=null;selectedFile=null;oldPdfUrl="";form.style.display="block";fy.value=year.value;type.value="CPRI";remarks.value="";pdf.value="";file.textContent="";clearError();form.scrollIntoView({behavior:"smooth"})}function picked(e){selectedFile=e.target.files[0]||null;file.textContent=selectedFile?"✓ "+selectedFile.name:""}
async function loadReports(){clearError();setStatus("Loading...");let y=Number(year.value);let {data,error}=await db.from(TABLE).select("id,created_at,year,report_type,pdf_url,remarks").eq("year",y).order("id",{ascending:false});if(error){setStatus("");body.innerHTML='<tr><td colspan="6" class="empty">Could not load reports.</td></tr>';showError("Supabase error:\n"+error.message);return}render(data||[]);setStatus("")}
function render(records){if(!records.length){body.innerHTML='<tr><td colspan="6" class="empty">No reports for this year.</td></tr>';return}body.innerHTML=records.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.year)}</td><td><span class="badge">${esc(r.report_type)}</span></td><td>${r.pdf_url?`<button onclick="viewPdf('${encodeURIComponent(r.pdf_url)}')">📄 View PDF</button><div class="file">${esc(fileNameFromUrl(r.pdf_url))}</div>`:"—"}</td><td>${esc(r.remarks||"—")}</td><td><div class="actions"><button onclick="editRow(${r.id})">Edit</button><button class="red" onclick="deleteRow(${r.id})">Delete</button></div></td></tr>`).join("")}
function viewPdf(u){let url=decodeURIComponent(u);if(url)window.open(url,"_blank","noopener")}
async function editRow(id){clearError();setStatus("Loading...");let {data,error:e}=await db.from(TABLE).select("id,created_at,year,report_type,pdf_url,remarks").eq("id",id).single();setStatus("");if(e){showError("Could not load this report:\n"+e.message);return}editId=data.id;oldPdfUrl=data.pdf_url||"";selectedFile=null;form.style.display="block";fy.value=data.year;type.value=data.report_type||"CPRI";remarks.value=data.remarks||"";pdf.value="";file.textContent=data.pdf_url?"Current PDF: "+fileNameFromUrl(data.pdf_url):"No PDF uploaded";form.scrollIntoView({behavior:"smooth"})}
async function uploadPdf(f,y,t){let path=`${y}/${t}/${Date.now()}_${Math.random().toString(36).slice(2,8)}_${safeFileName(f.name)}`;let {error:e}=await db.storage.from(BUCKET).upload(path,f,{cacheControl:"3600",upsert:false,contentType:"application/pdf"});if(e)throw new Error("PDF upload failed: "+e.message);let {data}=db.storage.from(BUCKET).getPublicUrl(path);if(!data?.publicUrl)throw new Error("Could not create public PDF URL.");return data.publicUrl}
async function removeStorageFile(url){if(!url)return;try{let marker=`/storage/v1/object/public/${BUCKET}/`,i=url.indexOf(marker);if(i<0)return;let path=decodeURIComponent(url.substring(i+marker.length));if(path)await db.storage.from(BUCKET).remove([path])}catch(e){console.warn("Old PDF removal warning",e)}}
async function save(){clearError();let y=Number(fy.value),t=type.value,r=remarks.value.trim();if(!editId&&!selectedFile){showError("Please upload a PDF report.");return}let b=document.querySelector("#form .green");b.disabled=true;b.textContent="Saving...";try{let pdfUrl=oldPdfUrl;if(selectedFile){if(selectedFile.type!=="application/pdf")throw new Error("Only PDF files are allowed.");pdfUrl=await uploadPdf(selectedFile,y,t)}let payload={year:y,report_type:t,pdf_url:pdfUrl||null,remarks:r||null};if(editId){let {error:e}=await db.from(TABLE).update(payload).eq("id",editId);if(e)throw new Error("Could not update report: "+e.message);if(selectedFile&&oldPdfUrl)await removeStorageFile(oldPdfUrl)}else{let {error:e}=await db.from(TABLE).insert(payload);if(e){if(pdfUrl&&selectedFile)await removeStorageFile(pdfUrl);throw new Error("Could not save report: "+e.message)}}year.value=y;cancel();await loadReports()}catch(e){showError(e.message||"Something went wrong while saving.")}finally{b.disabled=false;b.textContent="Save"}}
async function deleteRow(id){if(!confirm("Delete this report and its PDF?"))return;clearError();setStatus("Deleting...");try{let {data,error:e1}=await db.from(TABLE).select("id,pdf_url").eq("id",id).single();if(e1)throw new Error("Could not find report: "+e1.message);let {error:e2}=await db.from(TABLE).delete().eq("id",id);if(e2)throw new Error("Could not delete report: "+e2.message);if(data?.pdf_url)await removeStorageFile(data.pdf_url);await loadReports()}catch(e){setStatus("");showError(e.message||"Something went wrong while deleting.")}}
function cancel(){form.style.display="none";editId=null;selectedFile=null;oldPdfUrl="";pdf.value="";file.textContent="";clearError()}
years();loadReports();
</script></body></html>
