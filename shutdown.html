<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CURRENT ANNUAL SHUTDOWN</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#020711;color:#eef7ff}
header{padding:18px 20px;background:linear-gradient(135deg,#061727,#03101d);border-bottom:1px solid #16435f;position:sticky;top:0;z-index:5}
h1{margin:0 0 5px;font-size:23px}.sub{color:#8eb5ca;font-size:13px}
.wrap{max-width:1250px;margin:auto;padding:18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
button{border:0;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer;background:#087fd1;color:#fff}
button.dark{background:#123247}button.green{background:#07965d}button.red{background:#b72c45}
button:disabled{opacity:.6;cursor:not-allowed}
.card{background:linear-gradient(145deg,#061421,#081d2d);border:1px solid #17435b;border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 8px 30px #0005}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:650px){.controls{grid-template-columns:1fr}}
label{display:block;color:#8fb5c9;font-size:12px;margin-bottom:5px}
select,input,textarea{width:100%;background:#03101b;color:#fff;border:1px solid #24536a;border-radius:8px;padding:10px;font-size:14px}
select option{background:#03101b;color:#fff}textarea{min-height:70px}.tablewrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:1050px}
th,td{padding:9px;border-bottom:1px solid #183a4d;text-align:left;font-size:12px;vertical-align:middle}
th{color:#6fd5ff;background:#071b29}.permit{display:flex;gap:5px;flex-wrap:wrap}
.permit button{padding:7px 9px;font-size:11px;background:#102c3d;border:1px solid #24536a}
.permit button.active{background:#087fd1;border-color:#57cfff;box-shadow:0 0 10px #087fd166}
.edit-btn{padding:7px 12px;font-size:11px;background:#087fd1;border:1px solid #57cfff}
.status{padding:8px 9px}.section{background:#0a2435;color:#72d9ff;font-weight:bold}
.summary{display:flex;gap:10px;flex-wrap:wrap}.pill{background:#07364b;padding:8px 11px;border-radius:20px;color:#8fe5ff;font-size:12px}
.note{color:#87aabd;font-size:12px;line-height:1.5}
.message{margin-top:12px;padding:10px;border-radius:8px;display:none;font-size:13px}
.message.ok{display:block;background:#073c2b;color:#8ff0bd;border:1px solid #176c4b}
.message.err{display:block;background:#3b1820;color:#ffb7c1;border:1px solid #843442}
.empty{text-align:center;padding:25px;color:#789}
</style>
</head>
<body>
<header>
<h1>⚙ CURRENT ANNUAL SHUTDOWN</h1>
<div class="sub">CPP Transformer Maintenance System</div>
</header>

<div class="wrap">
<div class="toolbar">
<button onclick="newShutdown()">＋ Add New</button>
<button class="dark" id="saveButton" onclick="saveAll()">Save Changes</button>
<button class="red" onclick="deleteSavedShutdown()">Delete Saved Shutdown</button>
</div>

<div class="card">
<div class="controls">
<div><label>Select Unit</label>
<select id="unit">
<option value="1">UNIT 1</option><option value="2">UNIT 2</option><option value="3">UNIT 3</option>
<option value="4">UNIT 4</option><option value="5">UNIT 5</option><option value="6">UNIT 6</option>
<option value="7">UNIT 7</option><option value="8">UNIT 8</option><option value="9">UNIT 9</option><option value="10">UNIT 10</option>
</select></div>
<div><label>Shutdown Year</label><select id="year"></select></div>
</div>
<div class="note" style="margin-top:12px">Select a unit and shutdown year. Changes are stored centrally in Supabase when you press Save Changes.</div>
<div id="message" class="message"></div>
</div>

<div class="card">
<div class="summary"><span class="pill" id="count"></span><span class="pill" id="done"></span></div>
</div>

<div class="card">
<div class="tablewrap">
<table>
<thead><tr>
<th>S/N</th><th>Following Work Permit / Activity</th><th>Work Permit</th><th>Workstatus</th><th>Remarks</th><th>Action</th>
</tr></thead>
<tbody id="tbody"></tbody>
</table>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://xdzroykambkmpnafeasc.supabase.co";
const SUPABASE_KEY="sb_publishable_QYEMJXCzKRkK8Z8WLQw5Sg_7aPS5Sas";
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const TABLE="shutdown_records";

const baseA=[
"GT","UAT","GT MAR BOX","UAT MAR BOX","Lightning Transformer",
"PCC A","ESP A","PCC B","ESP B"
];

let rows=[];
let savedRowsExist=false;
let dirty=false;

function years(){
 const select=document.getElementById("year");
 let y=new Date().getFullYear(),s="";
 for(let n=y-2;n<=y+10;n++)s+=`<option value="${n}">${n}</option>`;
 select.innerHTML=s;
 select.value=y;
}

function keyValues(){
 return {
  unit:Number(document.getElementById("unit").value),
  year:Number(document.getElementById("year").value)
 };
}

function activitiesForUnit(u){
 const a=[...baseA];
 for(let n=1;n<=6;n++)a.push("RECTIFORMER "+n+"A");
 for(let n=1;n<=6;n++)a.push("RECTIFORMER "+n+"B");
 if(u<=6)for(let n=1;n<=7;n++)a.push("RECTIFORMER "+n+"C");
 return a;
}

function defaultRows(){
 const {unit,year}=keyValues();
 return activitiesForUnit(unit).map(name=>({
  id:null,unit,shutdown_year:year,activity:name,
  permit_applied:false,permit_issued:false,permit_returned:false,
  workstatus:"",remarks:""
 }));
}

function showMessage(text,type="ok"){
 const e=document.getElementById("message");
 e.textContent=text;e.className="message "+type;
}
function clearMessage(){document.getElementById("message").className="message";}

async function loadUnit(){
 clearMessage();
 const {unit,year}=keyValues();
 document.getElementById("tbody").innerHTML='<tr><td colspan="6" class="empty">Loading...</td></tr>';

 const {data,error}=await supabase.from(TABLE).select("*")
  .eq("unit",unit).eq("shutdown_year",year).order("id",{ascending:true});

 if(error){
  rows=defaultRows();savedRowsExist=false;dirty=false;render();
  showMessage("Supabase error while loading: "+error.message,"err");
  return;
 }

 if(data && data.length){
  rows=data;savedRowsExist=true;dirty=false;
 }else{
  rows=defaultRows();savedRowsExist=false;dirty=false;
 }
 render();
}

function render(){
 const body=document.getElementById("tbody");
 if(!rows.length){
  body.innerHTML='<tr><td colspan="6" class="empty">No activities.</td></tr>';
  updateSummary();return;
 }
 body.innerHTML=rows.map((r,i)=>`
 <tr>
  <td>${i+1}</td>
  <td><b>${esc(r.activity)}</b></td>
  <td>
   <div class="permit">
    ${permitBtn(i,"permit_applied","Applied",r.permit_applied)}
    ${permitBtn(i,"permit_issued","Issued/Received",r.permit_issued)}
    ${permitBtn(i,"permit_returned","Returned",r.permit_returned)}
   </div>
  </td>
  <td><input class="status" value="${esc(r.workstatus||"")}" placeholder="Workstatus" onchange="setField(${i},'workstatus',this.value)"></td>
  <td><textarea onchange="setField(${i},'remarks',this.value)" placeholder="Remarks">${esc(r.remarks||"")}</textarea></td>
  <td><button class="edit-btn" onclick="editRow(${i})">Edit</button></td>
 </tr>`).join("");
 updateSummary();
}

function permitBtn(i,field,label,active){
 return `<button class="${active?"active":""}" onclick="togglePermit(${i},'${field}')">${label}</button>`;
}

function togglePermit(i,field){
 if(!rows[i])return;
 rows[i][field]=!Boolean(rows[i][field]);
 dirty=true;
 render();
}

function setField(i,field,value){
 if(!rows[i])return;
 rows[i][field]=value;
 dirty=true;
}

function editRow(i){
 const r=rows[i];if(!r)return;
 const activity=prompt("Activity name:",r.activity||"");
 if(activity===null)return;
 r.activity=activity.trim()||r.activity;
 const workstatus=prompt("Workstatus:",r.workstatus||"");
 if(workstatus!==null)r.workstatus=workstatus;
 const remarks=prompt("Remarks:",r.remarks||"");
 if(remarks!==null)r.remarks=remarks;
 dirty=true;
 render();
}

function newShutdown(){
 const {unit,year}=keyValues();

 if(savedRowsExist || dirty){
  const ok=confirm("Start a new shutdown template for UNIT "+unit+" / "+year+"? Existing unsaved/saved data for this unit/year will be replaced when you save.");
  if(!ok)return;
 }
 rows=defaultRows();
 savedRowsExist=false;
 dirty=true;
 render();
 showMessage("✓ New shutdown template ready. Enter the details and press Save Changes.");
 window.scrollTo({top:0,behavior:"smooth"});
}

async function saveAll(show=true){
 const {unit,year}=keyValues();
 const button=document.getElementById("saveButton");
 button.disabled=true;button.textContent="Saving...";
 clearMessage();

 try{
  /* Keep the same one-row-per-activity design as the original file.
     We delete the selected unit/year records and then insert the current
     complete activity list. This also removes any stale activities. */
  const {error:delError}=await supabase.from(TABLE).delete()
   .eq("unit",unit).eq("shutdown_year",year);
  if(delError)throw delError;

  const payload=rows.map(r=>({
   unit:unit,
   shutdown_year:year,
   activity:r.activity||"",
   permit_applied:Boolean(r.permit_applied),
   permit_issued:Boolean(r.permit_issued),
   permit_returned:Boolean(r.permit_returned),
   workstatus:r.workstatus||"",
   remarks:r.remarks||""
  }));

  const {data,error}=await supabase.from(TABLE).insert(payload).select();
  if(error)throw error;

  rows=(data||[]).sort((a,b)=>a.id-b.id);
  savedRowsExist=true;dirty=false;
  render();
  if(show)showMessage("✓ Shutdown changes saved to Supabase.");
 }catch(e){
  showMessage("Could not save shutdown: "+(e.message||e),"err");
 }finally{
  button.disabled=false;button.textContent="Save Changes";
 }
}

async function deleteSavedShutdown(){
 const {unit,year}=keyValues();

 const {data,error}=await supabase.from(TABLE).select("id")
  .eq("unit",unit).eq("shutdown_year",year);

 if(error){showMessage("Could not check saved shutdown: "+error.message,"err");return;}

 if(!data || !data.length){
  showMessage("No saved shutdown record exists for UNIT "+unit+" / "+year+".");
  return;
 }

 if(!confirm("Delete the ENTIRE saved shutdown record for UNIT "+unit+" / "+year+"? This will remove all activities, work permits, workstatus and remarks."))return;

 const {error:deleteError}=await supabase.from(TABLE).delete()
  .eq("unit",unit).eq("shutdown_year",year);

 if(deleteError){showMessage("Could not delete shutdown: "+deleteError.message,"err");return;}

 rows=defaultRows();
 savedRowsExist=false;dirty=false;
 render();
 showMessage("✓ Entire saved shutdown record deleted.");
}

function updateSummary(){
 const completed=rows.filter(r=>String(r.workstatus||"").toLowerCase().includes("complete")).length;
 document.getElementById("count").textContent="Activities: "+rows.length;
 document.getElementById("done").textContent="Completed: "+completed;
}

function esc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 }[c]));
}

document.addEventListener("DOMContentLoaded",()=>{
 years();
 document.getElementById("unit").addEventListener("change",loadUnit);
 document.getElementById("year").addEventListener("change",loadUnit);
 loadUnit();
});
</script>
</body>
</html>
